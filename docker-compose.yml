# See doc/docker/README.md or https://github.com/instructure/canvas-lms/tree/master/doc/docker
services:
  web: &WEB
    build:
      context: .
    links:
      - postgres
      - redis
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    networks:
      - canvas-lms-network
      - mailnet
    env_file: .env 

  jobs:
    <<: *WEB
    command: bundle exec script/delayed_job run

  postgres:
    build: ./docker-compose/postgres
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    command: >
      postgres 
      -c max_connections=200
      -c superuser_reserved_connections=3
      -c shared_buffers=5GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=8GB
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_worker_processes=12
      -c autovacuum_max_workers=4
      -c autovacuum_naptime=45s
      -c idle_in_transaction_session_timeout=60000
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c min_wal_size=1GB
      -c max_wal_size=12GB
      -c checkpoint_timeout=15min
      -c wal_buffers=64MB
      -c wal_compression=on 
      -c synchronous_commit=local
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track_utility=off
    networks:
      - canvas-lms-network
    env_file: .env

  redis:
    image: redis:alpine
    command: >
      redis-server
      --maxmemory 2g
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 30
      --maxclients 2000
      --timeout 300
      --save ""
    networks:
      - canvas-lms-network
    env_file: .env
    restart: unless-stopped

networks:
  canvas-lms-network:
  mailnet:
    external: true
    name: mailnet
