# See doc/docker/README.md or https://github.com/instructure/canvas-lms/tree/master/doc/docker
services:
  web: &WEB
    build:
      context: .
    links:
      - postgres
      - redis
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    networks:
      - canvas-lms-network
    env_file: .env 

  jobs:
    <<: *WEB
    command: bundle exec script/delayed_job run

  postgres:
    build: ./docker-compose/postgres
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    command: >
      postgres
      -c max_connections=500
      -c superuser_reserved_connections=20
      -c shared_buffers=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=2GB
      -c wal_buffers=16MB
      -c effective_io_concurrency=100
      -c max_parallel_workers_per_gather=4
      -c autovacuum_max_workers=4
      -c autovacuum_naptime=45s
      -c idle_in_transaction_session_timeout=60000
    networks:
      - canvas-lms-network
    env_file: .env

  redis:
    image: redis:alpine
    command: redis-server --maxmemory 2g --maxmemory-policy allkeys-lru --tcp-keepalive 30 --maxclients 2000 --timeout 300
    networks:
      - canvas-lms-network
    env_file: .env
    restart: unless-stopped

networks:
  canvas-lms-network:
