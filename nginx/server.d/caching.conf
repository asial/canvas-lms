location ~* ^/dist/webpack-production/.*\.(js|css)$ {
    expires 2h;
    add_header Cache-Control "public, max-age=7200, immutable";
}
# 2. 画像ファイル - 2日間
location ~* \.(jpg|jpeg|png|gif|svg|ico)$ {
    expires 2d;
    add_header Cache-Control "public, max-age=172800";
}

# 3. フォントファイル - 2日間
location ~* \.(woff|woff2|ttf|eot|otf)$ {
    expires 2d;
    add_header Cache-Control "public, max-age=172800, immutable";
}

