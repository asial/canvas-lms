log_format canvas_detailed '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'request_time=$request_time '
                           'upstream_time=$upstream_response_time '
                           'upstream_connect=$upstream_connect_time '
                           'upstream_header=$upstream_header_time';

log_format canvas_performance '$time_iso8601|$remote_addr|$request_method|'
                              '$request_uri|$status|$body_bytes_sent|'
                              '$request_time|$upstream_response_time|'
                              '$upstream_connect_time|$upstream_header_time|'
                              '$upstream_addr|"$http_user_agent"';
