# to use this add docker-compose/rce-api.override.yml
# to your COMPOSE_FILE var in .env

services:
  web:
    links:
      - canvasrceapi

  canvasrceapi:
    image: instructure/canvas-rce-api
    ports:
      - "10002:80"
    environment:
      VIRTUAL_HOST: $RCEAPI_HOST
      VIRTUAL_PORT: 80
      HTTP_PROTOCOL_OVERRIDE: "https"
      PASSENGER_MIN_INSTANCES: 2
      PASSENGER_MAX_POOL_SIZE: 6
      NGINX_WORKER_CONNECTIONS: 2048
      STATSD_HOST: 127.0.0.1
      STATSD_PORT: 8125
      ECOSYSTEM_SECRET: $CANVAS_SIGNING_SECRET
      ECOSYSTEM_KEY: $CANVAS_ENCRYPTION_SECRET
      CIPHER_PASSWORD: $RCE_CIPHER_PASSWORD
    init: true
    networks:
      - canvas-lms-network
    env_file: .env
  
