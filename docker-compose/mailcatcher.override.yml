# to use this add docker-compose/mailcatcher.override.yml
# to your COMPOSE_FILE var in .env

services:
  web:
    links:
      - mailcatcher

  mailcatcher:
    image: instructure/mailcatcher
    ports:
      - "10003:8080"
    environment:
      VIRTUAL_HOST: $MAIL_HOST
      VIRTUAL_PORT: 8080
    networks:
      - canvas-lms-network
    env_file: .env

